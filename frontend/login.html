<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; Family Task Tracker</title>
<link rel="icon" href="icons/icon-checkmark.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="button" href="index.html">Home</a>
    <button id="theme-toggle-btn" class="small"></button>
  </div>

  <div class="card">
    <h2>Login</h2>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pin">6-digit PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary">Log in</button>
      <p id="error" class="error-text" style="display:none;"></p>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

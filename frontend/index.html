<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Task Tracker</title>
<link rel="icon" href="icons/icon-checkmark.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <button id="home-btn">Home</button>
    <a class="button" href="login.html">Login</a>

    <div class="date-picker">

    <div id="task-area"></div>

    <p id="footer-note" class="footer-note">Well, looks like you're free! For now...</p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/public.js"></script>

</html>
